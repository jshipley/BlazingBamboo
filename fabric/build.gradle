plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    // optional dependency
    modImplementation "maven.modrinth:simple-copper-pipes:loJugPYH" // 2.0.6-1.21.5
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/blazingbamboo.accesswidener")
    runs {
        datagen {
            inherit client
            "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/generated")}"
            vmArg "-Dfabric-api.datagen.modid=blazingbamboo"
            runDir "build/datagen"
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    file = remapJar.archiveFile
    changelog = file("../CHANGELOG.md").getText()
    type = BETA
    modLoaders.add("fabric")

    modrinth {
        projectId = "bZDWL6yP"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")

        minecraftVersions.add("1.21.5")

        requires("architectury-api")
        requires("yacl")
        optional("modmenu")

        announcementTitle = "Fabric version on Modrinth"
    }

    curseforge {
        projectId = "1230377"
        projectSlug = "blazing-bamboo-continued"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        
        minecraftVersions.add("1.21.5")
        javaVersions.add(JavaVersion.VERSION_21)

        requires("architectury-api")
        requires("yacl")
        optional("modmenu")

        announcementTitle = "Fabric version on Curseforge"
    }
}